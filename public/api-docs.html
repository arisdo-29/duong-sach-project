<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>API Đường Sách TP.HCM</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui.min.css"
    />
    <style>
      body {
        margin: 0;
        background: #fafafa;
      }
      .topbar {
        display: none;
      }
      .doc-note {
        max-width: 1460px;
        margin: 0 auto;
        padding: 16px 20px 0;
        font: 14px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #3b4252;
      }
      .doc-note code {
        background: #eceff4;
        padding: 1px 5px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="doc-note">
      Tài liệu sinh tự động từ <code>/api/openapi.json</code>. Mỗi module khai báo endpoint của
      mình trong <code>server/modules/&lt;module&gt;/&lt;module&gt;.openapi.ts</code>. Hợp đồng
      JSON đầy đủ nằm ở <code>docs/02-requirements-va-uu-tien.md</code>.
    </div>
    <div id="swagger-ui"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-standalone-preset.min.js"></script>
    <script>
      window.addEventListener('load', function () {
        window.ui = SwaggerUIBundle({
          url: '/api/openapi.json',
          dom_id: '#swagger-ui',
          deepLinking: true,
          docExpansion: 'list',
          defaultModelsExpandDepth: -1,
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          layout: 'BaseLayout',
        });
      });
    </script>
  </body>
</html>
