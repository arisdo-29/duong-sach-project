# Kiểm tra mỗi PR: schema Prisma hợp lệ, typecheck backend, build frontend.
# Không cần database: chỉ kiểm tra code biên dịch được.
# URL giả được chọn theo provider trong prisma/schema.prisma (bước "Chọn DATABASE_URL giả"),
# nên CI chạy được cả trước lẫn sau DB-01 (postgresql → sqlserver).
name: "✅ CI"

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Chọn DATABASE_URL giả theo provider (không kết nối thật)
        run: |
          if grep -Eq 'provider[[:space:]]*=[[:space:]]*"sqlserver"' prisma/schema.prisma; then
            echo 'DATABASE_URL=sqlserver://localhost:1433;database=ci;user=sa;password=Ci@123456;encrypt=true;trustServerCertificate=true' >> "$GITHUB_ENV"
          else
            echo 'DATABASE_URL=postgresql://ci:ci@localhost:5432/ci' >> "$GITHUB_ENV"
            echo 'DIRECT_URL=postgresql://ci:ci@localhost:5432/ci' >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma schema hợp lệ
        run: npx prisma validate && npx prisma generate
      - name: Typecheck backend (sau SETUP-01)
        run: |
          if [ -f tsconfig.server.json ]; then npx tsc -p tsconfig.server.json --noEmit; else echo "Chưa có tsconfig.server.json – bỏ qua"; fi
      - name: Build frontend
        run: npm run build
      - name: Test (nếu có)
        run: npm test --if-present

  e2e:
    # Kiểm thử giao diện bằng trình duyệt thật: app điều hướng phía client nên
    # gọi HTTP đơn thuần không phát hiện được lỗi mở sai màn hình (xem FE-01).
    runs-on: ubuntu-latest
    env:
      PUBLIC_BASE_URL: "http://localhost:5173"
    steps:
      - uses: actions/checkout@v5
      # URL giả: PrismaClient được khởi tạo khi nạp server nhưng test không chạm DB
      - name: Chọn DATABASE_URL giả theo provider (không kết nối thật)
        run: |
          if grep -Eq 'provider[[:space:]]*=[[:space:]]*"sqlserver"' prisma/schema.prisma; then
            echo 'DATABASE_URL=sqlserver://localhost:1433;database=ci;user=sa;password=Ci@123456;encrypt=true;trustServerCertificate=true' >> "$GITHUB_ENV"
          else
            echo 'DATABASE_URL=postgresql://ci:ci@localhost:5432/ci' >> "$GITHUB_ENV"
            echo 'DIRECT_URL=postgresql://ci:ci@localhost:5432/ci' >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cài trình duyệt cho Playwright
        run: npx playwright install --with-deps chromium
      - name: Chạy test giao diện
        run: npm run test:e2e
      - name: Lưu báo cáo khi test đỏ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
