# Tự động đổi nhãn "status: ..." của issue theo assign / PR / merge.
name: "🏷️ Đồng bộ nhãn trạng thái"

on:
  issues:
    types: [assigned, closed, reopened]
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: status-sync-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v8
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/status-sync.cjs`);
            await run({ github, context, core });
